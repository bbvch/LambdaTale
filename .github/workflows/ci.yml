on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
env:
  DOTNET_NOLOGO: true
permissions: {}
jobs:
  build:
    name: build
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      - run: dotnet run --project targets --no-launch-profile
      - name: publish
        if: github.event.release != null && matrix.os == 'windows-2022'
        env:
          API_KEY: ${{ secrets.NUGET_RAPHA_API_KEY }}
        run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ env.API_KEY }}
