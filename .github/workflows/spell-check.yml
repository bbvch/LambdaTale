on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  spell-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: npx cspell@9.3.2 "**/*"
